        L("Supaya tendangan makin tinggi: angkat lutut setinggi mungkin sebelum memutar pinggul, {s} × {r} tiap kaki.","To kick higher: lift the knee as high as possible before turning the hip, {s} × {r} per leg."),
        L("Tambahkan {s} × {r} tendangan ke target setinggi dada, naikkan targetnya sedikit tiap minggu.","Add {s} × {r} kicks to a chest-high target, raising it a little each week.")]:[

        L("Latih ap chagi sambil berpegangan pada dinding, {s} × {r} tiap kaki, fokus lutut naik dulu baru menendang.","Practise ap chagi holding a wall, {s} × {r} per leg, knee up first, then kick.")]);
    }else if(tier===2)say(grow,2,3,[
      L("Tendangan {m} baru {h}, sedikit di bawah target{bs}. Latihan: peregangan pinggul tahan {t} detik × 3, lalu {s} × {r} tendangan pelan ke target yang dinaikkan bertahap.","{Ms} kicks are {h}, a little below the target{bs}. Drill: hip stretches held {t} s × 3, then {s} × {r} slow kicks to a target raised step by step."),
      L("Tinggi tendangan {m} ({h}) masih bisa naik. Rutin split samping {t} detik × 3 dan {s} × {r} ayunan kaki setiap hari.","{Ms} kick height ({h}) can still go up. Daily side splits {t} s × 3 and {s} × {r} leg swings."),
      L("{N} menendang {h}; targetnya sedikit lebih tinggi{bs}. Coba latihan kupu-kupu (butterfly) {t} detik × 3 dan {s} × {r} tendangan ke target setinggi perut lalu dada.","{N} kicks {h}; the target is a bit higher{bs}. Try butterfly stretches {t} s × 3 and {s} × {r} kicks to a belly- then chest-high target.")]);
    else say(grow,1,3,[
      L("Tendangan {m} masih {h}, jadi kelenturan pinggul perlu jadi fokus utama. Setiap hari: peregangan kupu-kupu dan split tahan {t} detik × 3, lalu {s} × {r} ayunan kaki.","{Ms} kicks are still {h}, so hip flexibility should be the main focus. Daily: butterfly and split stretches held {t} s × 3, then {s} × {r} leg swings."),
      L("Fokus utama {m}: menaikkan tendangan yang masih {h}. Mulai dengan peregangan {t} detik × 3 setiap pagi dan {s} × {r} tendangan pelan ke target rendah.","{Ms} main focus: raising kicks that are still {h}. Start with {t} s × 3 stretches each morning and {s} × {r} slow kicks to a low target."),
      L("Tendangan {m} ({h}) perlu ditingkatkan{bs}. Latihan bertahap: angkat lutut setinggi pinggang {s} × {r}, baru kemudian tendang lurus.","{Ms} kicks ({h}) need work{bs}. Step by step: knee lifts to waist height {s} × {r}, then extend the kick.")]);
  }else if(an.kicks>0&&an.khTxt){        // hasil lama yang hanya menyimpan teks tinggi tendangan
    const strong=/bahu|wajah|kepala|shoulder|face|head/i.test(an.khTxt),weak=/pinggang|waist/i.test(an.khTxt);
    if(strong)good.push([2,L("Tendangan sudah tinggi (","Kicks are already high (")+an.khTxt+")"]);
    else if(weak)grow.push([2,L("Tinggi tendangan masih bisa ditambah. Peregangan pinggul akan membantu.","Kick height can still grow. Hip stretching will help.")]);
  }else if(an.kicks===0&&kyo)say(grow,4,4,[
    L("Belum ada tendangan yang terlihat jelas. Untuk video berikutnya, rekam dari samping dengan seluruh badan terlihat.","No clear kick was seen. Next time, film from the side with the whole body in frame."),
    L("Tendangan belum terdeteksi di video ini. Coba rekam saat {m} menendang ke mitt, kamera diam di samping.","No kicks detected in this video. Try filming while {m} kicks a mitt, camera still and to the side."),
    L("Tidak ada tendangan yang terlihat jelas — pastikan kaki tidak terpotong di tepi layar saat merekam.","No clear kicks were visible — make sure the feet aren't cut off at the edge of the frame.")]);

  // ---- kuda-kuda (sudut lutut; makin kecil = makin rendah) ----
  if(an.knee!=null){
    const tier=1+[170,160,150,135].filter(x=>an.knee<x).length;
    if(tier===5)say(good,2,5,[
      L("Kuda-kuda {m} rendah dan kokoh sekali — dasar yang sangat kuat.","{Ms} stance is very low and solid — a really strong base."),
      L("{N} punya kuda-kuda yang dalam dan stabil. Pertahankan!","{N} has a deep, stable stance. Keep it up!"),
      L("Kuda-kuda {m} sangat baik: rendah, kokoh, dan seimbang.","{Ms} stance is excellent: low, solid and balanced.")]);
    else if(tier===4)say(good,2,5,[
      L("Kuda-kuda {m} sudah rendah dan stabil.","{Ms} stance is already low and stable."),
      L("{N} menjaga kuda-kuda dengan baik — lutut tertekuk dan badan seimbang.","{N} holds the stance well — knees bent and body balanced."),
      L("Kuda-kuda {m} kokoh{bs}.","{Ms} stance is solid{bs}.")]);
    else if(tier===3){
      say(good,4,5,[
        L("Kuda-kuda {m} sudah cukup baik.","{Ms} stance is fairly good."),
        L("{N} sudah menekuk lutut dengan cukup baik saat kuda-kuda.","{N} bends the knees reasonably well in stance."),
        L("Kuda-kuda {m} cukup stabil{bs}.","{Ms} stance is fairly stable{bs}.")]);
      say(grow,3,6,kyo?[
        L("Supaya lebih kokoh saat tarung: tahan kuda-kuda tarung sambil memantul ringan {t} detik × 3.","For a firmer fighting stance: hold it while bouncing lightly, {t} s × 3."),
        L("Tekuk lutut sedikit lagi saat bergerak maju-mundur; latih step {s} × {t} detik.","Bend the knees a bit more when stepping in and out; practise steps {s} × {t} s."),
        L("Latih squat {s} × {r} agar kaki lebih kuat menahan kuda-kuda tarung.","Do {s} × {r} squats so the legs hold the fighting stance better.")]:[
        L("Supaya lebih kokoh, tekuk lutut sedikit lagi. Latihan: tahan ap kubi {t} detik × 3 tiap kaki.","To be more solid, bend the knee a little more. Drill: hold ap kubi {t} s × 3 per leg."),
        L("Latih perpindahan jurus pelan-pelan sambil menjaga lutut tetap tertekuk, {s} kali satu jurus penuh.","Practise the form slowly keeping the knees bent, {s} full run-throughs."),
        L("Tahan juchum seogi {t} detik × 3 agar kuda-kuda di jurus makin rendah.","Hold juchum seogi {t} s × 3 to lower the stance in forms.")]);
    }else if(tier===2)say(grow,2,6,[
      L("Kuda-kuda {m} masih agak tinggi. Latihan: squat {s} × {r} dan tahan juchum seogi {t} detik × 3.","{Ms} stance is still a bit high. Drill: {s} × {r} squats and hold juchum seogi {t} s × 3."),
      L("{N} perlu menekuk lutut lebih dalam saat kuda-kuda. Coba tahan ap kubi {t} detik × 3 tiap kaki di depan cermin.","{N} needs to bend the knees deeper in stance. Hold ap kubi {t} s × 3 per leg in front of a mirror."),
      L("Kuda-kuda {m} bisa lebih rendah. Lompatan squat (squat jump) {s} × {r} akan menguatkan kaki.","{Ms} stance can go lower. {s} × {r} squat jumps will strengthen the legs.")]);
    else say(grow,1,6,[
      L("Lutut {m} masih hampir lurus saat kuda-kuda. Mulai dengan juchum seogi {t} detik × 3 dan squat {s} × {r}, sambil dicek di depan cermin.","{Ms} knees are almost straight in stance. Start with juchum seogi {t} s × 3 and {s} × {r} squats, checking in a mirror."),
      L("Fokus kuda-kuda: {m} masih berdiri terlalu tegak. Latih tekuk lutut sampai tidak terlihat jari kaki, tahan {t} detik × 3.","Stance focus: {m} still stands too upright. Bend until the toes are hidden by the knee, hold {t} s × 3."),
      L("Kuda-kuda {m} perlu banyak dilatih. Squat {s} × {r} setiap hari akan sangat membantu.","{Ms} stance needs a lot of work. Daily {s} × {r} squats will help a lot.")]);
  }

  // ---- guard (khusus Kyorugi) ----

      L("Guard {m} sangat rapi sepanjang video.","{Ms} guard stays very tidy throughout."),
      L("{N} tidak lupa menjaga guard, bahkan saat menendang.","{N} keeps the guard up even while kicking.")]);
    else if(tier===4)say(good,2,7,[

      L("Posisi guard {m} sudah bagus.","{Ms} guard position is good.")]);
    else if(tier===3){
      say(good,4,7,[
        L("Guard {m} sudah cukup terjaga.","{Ms} guard is held fairly well."),

        L("Tangan {m} cukup sering di posisi guard.","{Ms} hands are in guard fairly often.")]);
      say(grow,3,8,[
        L("Perhatikan tangan setelah menendang — sering turun. Latihan: shadow kyorugi {s} ronde × 1 menit, tangan kembali ke dagu setelah tiap tendangan.","Watch the hands after kicking — they often drop. Drill: {s} rounds × 1 min shadow sparring, hands back to the chin after each kick."),
        L("Biasakan tangan kembali ke guard setelah menendang: {s} × {r} tendangan dengan tangan tetap di dagu.","Make hands return to guard after kicks: {s} × {r} kicks keeping hands at the chin."),
        L("Latihan guard: {s} × {t} detik bergerak maju-mundur, pelatih menepuk ringan bila tangan turun.","Guard drill: {s} × {t} s stepping in and out, coach taps lightly whenever hands drop.")]);
    }else say(grow,tier,8,[
      L("Tangan {m} sering turun saat bergerak dan menendang. Latihan: step maju-mundur {s} × {t} detik dengan tangan menempel di guard, lalu {s} × {r} tendangan sambil menahan guard.","{Ms} hands often drop while moving and kicking. Drill: step in and out {s} × {t} s with hands glued to guard, then {s} × {r} kicks holding the guard."),
      L("Guard {m} perlu dilatih: ingatkan \"tangan di dagu\" setiap kali selesai menendang. Shadow kyorugi {s} ronde × 1 menit.","{Ms} guard needs work: remind \"hands at chin\" after every kick. Shadow sparring {s} rounds × 1 min."),
      L("{N} masih sering lupa menjaga guard. Latih {s} × {r} tendangan dengan memegang ujung sabuk di dagu agar tangan tidak turun.","{N} often forgets the guard. Practise {s} × {r} kicks holding the belt ends at the chin so the hands stay up.")]);
  }

  // ---- tempo serangan (khusus Kyorugi) ----
  if(an.kpm!=null){
    const tier=_anaLvl(an.kpm,[0.5,3,6,10]);
    if(tier>=4)say(good,3,9,[
      L("{N} aktif menyerang dengan tempo yang bagus.","{N} attacks actively at a good pace."),
      L("Tempo serangan {m} tinggi dan berani.","{Ms} attacking pace is high and confident."),
      L("{N} tidak ragu menyerang — temponya bagus.","{N} doesn't hesitate to attack — good pace.")]);
    else if(tier<=2)say(grow,3,9,[
      L("Serangan {m} masih jarang. Latihan: kombinasi 2 tendangan cepat ke mitt {s} × {r}.","{Ms} attacks are still rare. Drill: fast 2-kick combos to a mitt {s} × {r}."),
      L("Ajak {m} lebih berani menyerang: {s} ronde × 30 detik menendang mitt terus-menerus.","Encourage {m} to attack more: {s} rounds × 30 s of continuous mitt kicks."),
      L("Tambah tempo: {s} × {r} tendangan cepat bergantian kiri-kanan ke mitt.","Build pace: {s} × {r} fast alternating left-right mitt kicks.")]);
  }

  // ---- perbandingan dengan video sebelumnya ----
  if(P){
    if(an.kh!=null&&P.kh!=null&&an.kicks>0){
      const d=an.kh-P.kh;o.ph=kickLabel(P.kh);
      if(d>=0.1)say(good,1,10,o.ph!==o.h?[
        L("Ada kemajuan: tendangan {m} naik dari {ph} ({pd}) menjadi {h}.","Progress: {ms} kicks rose from {ph} ({pd}) to {h}."),
        L("Dibanding video {pd}, tendangan {m} sekarang lebih tinggi ({h}).","Compared with the {pd} video, {ms} kicks are now higher ({h})."),
        L("Kerja keras {m} terlihat: tendangan naik dari {ph} ({pd}) ke {h}.","{Ms} hard work shows: kicks went from {ph} ({pd}) to {h}.")]:[
        L("Ada kemajuan: tendangan {m} lebih tinggi dibanding video {pd}.","Progress: {ms} kicks are higher than in the {pd} video."),
        L("Dibanding {pd}, tendangan {m} naik sedikit — terus pertahankan.","Compared with {pd}, {ms} kicks rose a little — keep it going."),
        L("Kerja keras {m} terlihat: tendangan naik sejak {pd}.","{Ms} hard work shows: kicks are higher than on {pd}.")]);
      else if(d<=-0.15)say(grow,4,10,[
        L("Tendangan hari ini lebih rendah dibanding {pd} ({ph}). Bisa karena lelah atau sudut kamera — pastikan pemanasan peregangan cukup.","Kicks today are lower than on {pd} ({ph}). Could be tiredness or camera angle — make sure to warm up and stretch."),
        L("Dibanding video {pd}, tendangan sedikit turun. Coba rekam lagi setelah pemanasan.","Kicks dropped a little since {pd}. Try filming again after a warm-up."),
        L("Tinggi tendangan turun dari {ph} ({pd}). Ulangi peregangan pinggul sebelum latihan.","Kick height fell from {ph} ({pd}). Repeat hip stretches before training.")]);
      else if(Math.abs(d)<0.1&&an.kh-(0.35+0.075*(Number(an.bi)||0))>=-0.1)say(good,5,10,[
        L("Tinggi tendangan {m} konsisten sejak {pd}.","{Ms} kick height has been consistent since {pd}."),
        L("Tendangan {m} stabil dibanding video {pd}.","{Ms} kicks are steady compared with {pd}."),
        L("Konsisten: tendangan {m} sama baiknya dengan {pd}.","Consistent: {ms} kicks are as good as on {pd}.")]);
    }
    if(an.knee!=null&&P.knee!=null){
      const d=an.knee-P.knee;
      if(d<=-8)say(good,1,11,[
        L("Kuda-kuda {m} lebih rendah dan kokoh dibanding video {pd}.","{Ms} stance is lower and firmer than in the {pd} video."),
        L("Ada kemajuan kuda-kuda sejak {pd} — lutut lebih tertekuk.","Stance has improved since {pd} — knees are bending more."),
        L("Dibanding {pd}, {m} sekarang berdiri lebih rendah di kuda-kuda.","Compared with {pd}, {m} now sits lower in stance.")]);
      else if(d>=10)say(grow,4,11,[
        L("Kuda-kuda hari ini lebih tinggi dibanding {pd}; ingatkan {m} untuk menekuk lutut.","Today's stance is higher than on {pd}; remind {m} to bend the knees."),
        L("Lutut {m} lebih lurus dibanding video {pd}. Tambahkan latihan tahan kuda-kuda.","{Ms} knees are straighter than in the {pd} video. Add stance-hold drills."),
        L("Kuda-kuda sedikit naik sejak {pd} — ulangi squat sebelum latihan.","Stance rose a little since {pd} — repeat squats before training.")]);
    }
    if(an.guard!=null&&P.guard!=null){
      const d=an.guard-P.guard;
      if(d>=0.15)say(good,1,12,[
        L("Guard {m} membaik sejak {pd}.","{Ms} guard has improved since {pd}."),
        L("Dibanding video {pd}, tangan {m} lebih sering di posisi guard.","Compared with {pd}, {ms} hands stay in guard more often."),
        L("Kemajuan guard terlihat jelas sejak {pd}.","Clear guard progress since {pd}.")]);
      else if(d<=-0.2)say(grow,4,12,[
        L("Guard lebih sering turun dibanding {pd}. Ulangi latihan tangan di dagu.","The guard drops more than on {pd}. Repeat hands-at-chin drills."),
        L("Tangan {m} lebih sering turun dibanding video {pd}.","{Ms} hands drop more often than in the {pd} video."),
        L("Guard menurun sejak {pd}; fokuskan lagi di latihan berikutnya.","Guard slipped since {pd}; refocus on it next session.")]);
    }
  }

  const ord=a=>a.sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
  const g=ord(good).slice(0,3),w=ord(grow).slice(0,3);
  if(!g.length)g.push(nm?F(_anaPick(an,13,[
    L("Terima kasih sudah berlatih, {N}! Konsisten berlatih adalah kuncinya 💪","Thanks for training, {N}! Consistency is the key 💪"),
    L("{N}, setiap latihan membawa kemajuan — terus semangat! 💪","{N}, every session brings progress — keep it up! 💪"),
    L("Semangat {N}! Latihan rutin akan membuat tendangan dan kuda-kuda makin kuat 💪","Go {N}! Regular training will make kicks and stances stronger 💪")])):L("Terus semangat berlatih! 💪","Keep up the great training! 💪"));
  return {good:g,grow:w};
}
function fmtEvalNote(val){
  if(!val||typeof val!=="object")return"";
  const n=String(val.n||"");
  const isAuto=/Estimasi otomatis|Automatic estimate/.test(n);
  let an=(val.an&&typeof val.an==="object")?val.an:null;
  if(!an&&isAuto)an=legacyToAn(n);
  if(!an){
    if(!n)return"";
    return isAuto?`<div class="an-note"><div class="an-head"><span class="an-tag">🎥 ${T("Analisa Video","Video analysis")}</span></div><div class="soft-l">${esc(n.replace(/\((?:Estimasi otomatis|Automatic estimate)[^)]*\)\.?/g,"").slice(0,300))}</div></div>`:coachNoteHtml(n);
  }
  const mode={poomsae:"Poomsae",kyorugi:"Kyorugi"}[an.m]||"";
  const good=[],grow=[],det=[];
  const sec=(cls,ic,title,items)=>items.length?`<div class="soft-h ${cls}">${ic} ${title}</div>${items.map(t=>`<div class="soft-l">${esc(t)}</div>`).join("")}`:"";
  if(an.src==="cloud"){
    if(an.txt)good.push(an.txt);
    (an.tips||[]).forEach(t=>grow.push(t));
  }else{
    const khT=an.khTxt||(an.kh!=null?kickLabel(an.kh):"");
    {const tx=anaDeviceText(an);tx.good.forEach(t=>good.push(t));tx.grow.forEach(t=>grow.push(t));}
    if(!grow.length&&an.tipsTxt&&an.tipsTxt[0])grow.push(an.tipsTxt[0]);
    if(an.kicks!=null)det.push(T("Tendangan terdeteksi: ","Kicks detected: ")+an.kicks+"×"+(khT?" ("+khT+")":""));
    if(an.knee!=null)det.push(T("Sudut lutut: ","Knee angle: ")+Math.round(an.knee)+"°");
    if(an.guard!=null)det.push(T("Guard terjaga: ","Guard held: ")+Math.round(an.guard*100)+"%");
    if(an.kpm!=null)det.push(T("Tempo: ","Pace: ")+an.kpm+T(" tendangan/menit"," kicks/min"));
    if(an.wt)det.push("Poomsae WT"+(an.wt.j?" ("+an.wt.j+")":"")+": Accuracy "+an.wt.a+"/4, Presentation "+an.wt.p+"/6, Total "+an.wt.t+"/10");
  }
  if(!good.length)good.push(T("Terus semangat berlatih! 💪","Keep up the great training! 💪"));
  return`<div class="an-note"><div class="an-head"><span class="an-tag">🎥 ${T("Analisa Video","Video analysis")}</span>${mode?`<span>· ${mode}</span>`:""}${an.cnt>1?`<span>· ${an.cnt} video</span>`:""}</div>${sec("soft-good","🌟",T("Sudah baik","Doing well"),good)}${sec("soft-grow","🌱",an.src==="cloud"?T("Saran latihan","Training tips"):T("Perlu dilatih","To work on"),grow)}${det.length?`<details class="soft-d"><summary>${T("Lihat detail teknis","See technical details")}</summary><div>${esc(det.join(" · "))}</div></details>`:""}<div class="an-foot">${T("Estimasi otomatis, bukan penilaian resmi.","Automatic estimate, not an official assessment.")}</div></div>`;
}
function langBarHtml(inline){const pill=`<div class="lang-pill" role="group" aria-label="Language"><span class="gl">${GLOBE_SVG}</span><button type="button" data-setlang="id" aria-pressed="${!isEN()}">ID</button><button type="button" data-setlang="en" aria-pressed="${isEN()}">EN</button></div>`;return inline?pill:`<div class="top-util">${pill}</div>`;}

// "Kunci" pengirim ulasan: ID portal murid kalau ada, selain itu token acak yang disimpan di perangkat.
// Server membuat ID ulasan dari kunci ini, jadi hanya pengirim yang sama yang bisa memperbarui ulasannya sendiri.
function reviewKey(pref){const ok=v=>/^[A-Za-z0-9_-]{7,120}$/.test(String(v||""));if(ok(pref))return String(pref);let t="";try{t=localStorage.getItem("dojang_parent_dev_id")||""}catch(e){}if(!ok(t)){t=Array.from(crypto.getRandomValues(new Uint8Array(12)),b=>b.toString(16).padStart(2,"0")).join("");try{localStorage.setItem("dojang_parent_dev_id",t)}catch(e){}}return t;}
const isParentCoachEvalDoc=x=>Boolean(x&&(x.type==="coach_eval"||String(x.id||"").startsWith("coach_eval__")));

function readEvalFieldScore(evObj,fieldDef){
  if(!evObj||typeof evObj!=="object")return null;
  const vDirect=Number(evObj[fieldDef.key]);
  if(Number.isFinite(vDirect)&&vDirect>=1&&vDirect<=5)return vDirect;
  const vLegacy=Number(evObj[fieldDef.legacy]);
  if(Number.isFinite(vLegacy)&&vLegacy>=1&&vLegacy<=5)return vLegacy;
  return null;
}

function getAllEvalScoresFromEntry(evObj){
  if(!evObj||typeof evObj!=="object")return[];
  const out=[];
  SK_EVAL_FIELDS.forEach(f=>{const v=readEvalFieldScore(evObj,f);if(v!==null)out.push(v);});
  return out;
}

function formatEvalEntryScores(evObj){
  if(!evObj||typeof evObj!=="object")return"";
  const hasNew=SK_EVAL_FIELDS.some(f=>Number.isFinite(Number(evObj[f.key]))&&Number(evObj[f.key])>=1);
  if(hasNew){
    const have=SK_EVAL_FIELDS.filter(f=>Number(evObj[f.key])>=1);const chips=have.map(f=>{const st=skStyle(f.skill,0);return`<span class="sc" style="--c:${st[0]}">${st[1]} ${isEN()?f.shortEn:f.shortId} <b>${evObj[f.key]}</b></span>`}).join("");const avg=have.length>=2?(have.reduce((a,f)=>a+Number(evObj[f.key]),0)/have.length).toFixed(1):"";return chips+(avg?`<span class="sc avg" style="--c:#F5C842">⭐ ${T("Rata-rata","Avg")} <b>${avg}</b></span>`:"");
  }
  return `T:${evObj.t||"–"} · ${isEN()?"A":"S"}:${evObj.k||"–"} · ${isEN()?"P":"F"}:${evObj.f||"–"}`;
}

function computeStudentSkills(rawSk,evalItems){
  const base={...(rawSk&&typeof rawSk==="object"?rawSk:{})};
  const valid=(Array.isArray(evalItems)?evalItems:[]).filter(x=>x&&typeof x==="object"&&!isParentCoachEvalDoc(x));
  const out={};
  SK_EVAL_FIELDS.forEach(f=>{
    const vals=valid.map(x=>readEvalFieldScore(x,f)).filter(v=>v!==null);
    const evVal=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length)*20:null;
    const manual=Number(base[f.skill]);
    const hasManual=Number.isFinite(manual)&&manual!==50;
    let val=50;
    if(evVal!==null){
      val=hasManual?Math.round(manual*0.3+evVal*0.7):Math.round(evVal);
    }else if(Number.isFinite(manual)){
      val=Math.round(manual);
    }
    out[f.skill]=Math.max(0,Math.min(100,val));
  });
  return out;
}

function mergeCoachListFromPublic(data){
  const m=new Map();
  const put=(rawName,extra={})=>{
    const clean=String(rawName||"").trim();
    if(!clean)return;
    const key=slug(clean);
    const prev=m.get(key)||{id:key,name:clean,gender:"",wa:"",dan:"DAN 1 Kukkiwon",unit:"Utama",bio:""};
    m.set(key,{...prev,...extra,id:extra.id||prev.id||key,name:extra.name||prev.name||clean});
  };
  put(HEAD(),{unit:"Semua Unit"});
  (data.coaches||[]).forEach(c=>put(c.name||c.id,c));
  (data.classes||[]).forEach(c=>String(c.p||"").split(",").forEach(p=>put(p)));
  (data.evaluations||[]).filter(x=>!isParentCoachEvalDoc(x)&&x.coach!==AI_COACH).forEach(e=>put(e.coach));
  return [...m.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name),"id"));
}

function calcPublicCoachAggregate(cRec,allEvals){
  const key=cRec.id,nSlug=slug(cRec.name);
  const pReviews=(allEvals||[]).filter(x=>isParentCoachEvalDoc(x)&&(x.targetCoachId===key||slug(x.targetCoachName||"")===nSlug)).sort((a,b)=>String(b.updatedAt||b.date||b.id||"").localeCompare(String(a.updatedAt||a.date||a.id||"")));
  const rs=cRec.ratingSummary||{};
  const adminSessions=Number(rs.sessions)||0;
  const keys=[["m","Mengajar"],["t","Teknik"],["k","Komunikasi"],["d","Disiplin"],["w","Ketepatan"]];
  const sk={};
  let sumAll=0,cntAll=0;
  keys.forEach(([k,label])=>{
    const pVals=pReviews.map(r=>Number((r.ratings||{})[k])).filter(v=>v>=1&&v<=5).map(v=>v*20);
    const hasAdmin=adminSessions>0&&Number(rs[label])>0;
    const totWeight=(hasAdmin?adminSessions:0)+pVals.length;
    if(totWeight>0){
      const weightedSum=(hasAdmin?Number(rs[label])*adminSessions:0)+pVals.reduce((a,b)=>a+b,0);
      sk[label]=Math.round(weightedSum/totWeight);
      sumAll+=sk[label];
      cntAll++;
    }else{
      sk[label]=0;
    }
  });
  const totalEvalCount=adminSessions+pReviews.length;
  const pct=cntAll?Math.round(sumAll/cntAll):0;
  const avg5=cntAll?(pct/20).toFixed(1):"–";
  const lastNote=(pReviews.find(r=>r.comment)?.comment)||rs.lastNote||"";
  return{sk,pct,avg5,totalEvalCount,adminSessions,parentCount:pReviews.length,pReviews,lastNote};
}

    const a=pts[i-1],b=pts[i+1];if(!p||!a||!b||a.length!==p.length||b.length!==p.length)return p;
    const med=(x,y,z)=>x>y?(y>z?y:(x>z?z:x)):(x>z?x:(y>z?z:y));
    return p.map((q,k)=>({x:med(a[k].x,q.x,b[k].x),y:med(a[k].y,q.y,b[k].y),v:q.v}));
  });
}
function poseSmoothFr(fr){const sm=poseSmooth(fr.map(f=>f.p));return fr.map((f,i)=>({t:f.t,p:sm[i]}))}
function poseScore(pts,mode,st,dur){
  pts=poseSmooth(pts);
  const ok=(p,i)=>p[i]&&p[i].v>0.5,d2=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const ang=(a,b,c)=>{const x1=a.x-b.x,y1=a.y-b.y,x2=c.x-b.x,y2=c.y-b.y,m=Math.hypot(x1,y1)*Math.hypot(x2,y2);return m?Math.acos(Math.max(-1,Math.min(1,(x1*x2+y1*y2)/m)))*180/Math.PI:180};
  const rows=[];
  for(const p of pts){
    if(!p||![11,12,23,24,25,26,27,28].every(i=>ok(p,i)))continue;
    const sh={x:(p[11].x+p[12].x)/2,y:(p[11].y+p[12].y)/2},hp={x:(p[23].x+p[24].x)/2,y:(p[23].y+p[24].y)/2},tor=d2(sh,hp);
    if(tor<8)continue;
    const kL=(p[26].y-p[27].y)/tor>0.15,kR=(p[25].y-p[28].y)/tor>0.15,hL=(hp.y-p[27].y)/tor,hR=(hp.y-p[28].y)/tor,both=ok(p,15)&&ok(p,16);
    rows.push({knee:(ang(p[23],p[25],p[27])+ang(p[24],p[26],p[28]))/2,kick:kL||kR,kh:(kL&&kR)?Math.max(hL,hR):kL?hL:kR?hR:null,guard:both?((hp.y-p[15].y)/tor>0.35&&(hp.y-p[16].y)/tor>0.35):null});
  }
  const valid=rows.length/pts.length;
  if(valid<0.4)throw new Error(T("Tubuh murid kurang terdeteksi. Pastikan seluruh badan terlihat, kamera diam, dan hanya ada satu murid di layar.","The student's body was poorly detected. Make sure the whole body is visible, the camera is steady, and only one student is on screen."));
  const q=(arr,f)=>{const s=[...arr].sort((a,b)=>a-b);return s[Math.min(s.length-1,Math.max(0,Math.floor(f*(s.length-1))))]};
  const lvl=(x,cuts)=>1+cuts.filter(c=>x>=c).length;
  const kicks=(()=>{let c=0,run=0;rows.forEach(r=>{if(r.kick)run++;else{if(run>=2)c++;run=0}});if(run>=2)c++;return c})();
  const kf=rows.filter(r=>r.kick&&r.kh!==null).map(r=>r.kh),stand=rows.filter(r=>!r.kick).map(r=>r.knee);
  const expect=0.35+0.075*(Number(st&&st.bi)||0);
  const kmax=kf.length>=2?q(kf,0.9):null,k25=stand.length>=8?q(stand,0.25):null;
  const kel=kmax!==null?lvl(kmax-expect,[-0.35,-0.1,0.15,0.4]):null;
  const kek=k25!==null?1+[170,160,150,135].filter(t=>k25<t).length:null;
  let kyo=null,gr=null,kpm=null;
  if(mode==="kyorugi"){
    const g=rows.filter(r=>r.guard!==null);gr=g.length>=5?g.filter(r=>r.guard).length/g.length:null;kpm=kicks/(dur/60);
    const gs=gr!==null?lvl(gr,[0.2,0.4,0.6,0.8]):null,ks=lvl(kpm,[0.5,3,6,10]);

  }
  const hl=x=>x<0.2?T("setinggi pinggang atau lebih rendah","waist height or lower"):x<0.6?T("sekitar perut hingga dada","about belly to chest"):x<1?T("sekitar dada hingga bahu","about chest to shoulder"):x<1.25?T("setinggi bahu hingga wajah","shoulder to face height"):T("setinggi kepala","head height");
  const notes=[];
  notes.push(kmax!==null?T("Tendangan tertinggi ","Highest kick ")+hl(kmax)+" ("+kicks+" "+T("tendangan terdeteksi","kicks detected")+").":T("Tidak ada tendangan yang terlihat jelas.","No clear kick was visible."));
  if(k25!==null)notes.push(T("Sudut lutut saat kuda-kuda/berdiri sekitar ","Knee angle in stance about ")+Math.round(k25)+"°.");
  if(gr!==null)notes.push(T("Posisi guard terjaga ","Guard held ")+Math.round(gr*100)+T("% waktu.","% of the time."));
  if(kpm!==null)notes.push(Math.round(kpm*10)/10+" "+T("tendangan/menit.","kicks/min."));
  notes.push(T("(Estimasi otomatis dari pose tubuh, bukan penilaian resmi.)","(Automatic estimate from body pose, not an official assessment.)"));
  const saran=[];
  if(kel!==null&&kel<=2)saran.push(T("Perbanyak peregangan pinggul dan latihan tendangan bertahap untuk menambah tinggi tendangan.","More hip stretching and gradual kicking drills to raise kick height."));

  if(gr!==null&&gr<0.4)saran.push(T("Biasakan tangan tetap di posisi guard saat bergerak dan menendang.","Keep hands in guard position when moving and kicking."));

}

  // Pelacakan beberapa orang antar-bagian video (koordinat 0..1). Jarak diukur relatif terhadap tinggi badan.

  // Selalu hanya menerima orang dengan tinggi badan serupa (0.6-1.6x rata-rata tinggi orang itu) agar tidak tertukar dengan orang lain/pelatih.
  function anaTrack(dets,people,iSel){
    const n=dets.length,GATE=0.9;
    const tracks=people.map(p=>({n:p.n,st:p.st,cx:p.box.cx,cy:p.box.cy,h:p.box.h,href:p.box.h,miss:0,pts:new Array(n).fill(null)}));
    const init=tracks.map(t=>({cx:t.cx,cy:t.cy,h:t.h,href:t.href}));
    const step=i=>{
      const ds=dets[i]||[],pairs=[];
      tracks.forEach((t,ti)=>ds.forEach((d,di)=>{
        const dist=Math.hypot(d.b.cx-t.cx,d.b.cy-t.cy)/Math.max(t.h,0.15),gate=GATE*(1+0.5*Math.min(t.miss,4));
        if(dist>gate)return;

        pairs.push([dist,ti,di]);
      }));
      pairs.sort((a,b)=>a[0]-b[0]);
      const ut=new Set(),ud=new Set();
      for(const [,ti,di] of pairs){

        ut.add(ti);ud.add(di);const t=tracks[ti],d=ds[di];t.pts[i]=d.pts;t.cx=d.b.cx;t.cy=d.b.cy;t.h=d.b.h;t.href=0.85*t.href+0.15*d.b.h;t.miss=0;
      }
      tracks.forEach((t,ti)=>{if(!ut.has(ti))t.miss++;});

  function pmDetectBursts(d,sr){
    const win=Math.max(1,Math.round(sr*0.02)),n=Math.floor(d.length/win),env=new Float32Array(n);

    if(n<10)return null;
    const s=[...env].sort((a,b)=>a-b),med=s[Math.floor(n*0.5)],p99=s[Math.floor(n*0.99)];
    if(p99<0.0025)return {silent:true,bursts:[]};
    const thr=Math.max(med*5,p99*0.35,0.006),gap=3,bursts=[];let i=0;
    while(i<n){
      if(env[i]<thr){i++;continue}
      let j=i,last=i;while(j+1<n&&j-last<=gap){j++;if(env[j]>=thr)last=j}
      const dur=(last-i+1)*0.02;let pk=0;for(let k=i;k<=last;k++)pk=Math.max(pk,env[k]);
      if(dur>=0.06&&dur<=0.8)bursts.push({t:Math.round(i*0.02*100)/100,dur:Math.round(dur*100)/100,peak:Math.round(pk*1000)/1000});
      i=last+1;
    }
    return {silent:false,bursts};
  }

  async function anaRunMulti(){

    if(!anaState.file||!anaState.prev)return toast(T("Pilih video dulu","Choose a video first"));

    if(people.some(p=>!p.st.foto))throw new Error(T("Ada murid tanpa izin foto/video","A student has no photo/video consent"));
    const myId=++anaState.runId;
    anaState.busy=true;anaState.multi=null;anaState.res=null;anaState.err="";anaState.msg=T("Mengambil gambar dari video...","Extracting frames...");draw();

      const mode=anaState.mode;

      const date=ymd(),ex=findEvalDoc(date,AI_COACH),docId=ex?ex.id:date+"__"+slug(AI_COACH),ev={...((ex&&ex.ev)||{})},items=[];
      for(const o of out){

        const entry={};SK_EVAL_FIELDS.forEach(f=>{const x=Number(o.result[f.key]);if(x>=1&&x<=5)entry[f.key]=x});
        if(!Object.keys(entry).length){items.push({...o,error:T("Tidak ada aspek yang bisa dinilai dari video ini","No aspect could be scored from this video")});continue;}
        const st=o.st,old=ev[st.id]||null,mm={};

        mm.an=an;mm.n="🎥 Analisa video";ev[st.id]=mm;items.push({...o,prev:old,an,saved:true});
      }

      anaState.multi={docId,date,items};

    }catch(err){if(myId===anaState.runId)anaState.err=err.message||String(err);}
    if(myId===anaState.runId){anaState.busy=false;anaState.msg="";draw();}
  }

    const status=pend?`<span class="pill warn">${T("Belum disimpan","Not saved yet")}</span>`:(real?`<span class="pill ok">✓ ${T("Logo aktif","Logo active")}</span>`:`<span class="pill">${T("Memakai logo bawaan","Using default logo")}</span>`);
    return `<div class="sec logo-sec"><h2>🖼️ ${T("Logo Dojang","Dojang Logo")} ${status}</h2><p class="mu" style="margin:0">${T("Upload logo sekali, otomatis tampil di Dashboard, menu samping, layar PIN, Portal Orang Tua, Portal Pelatih, halaman Profil Pelatih, dan ikon tab browser. Tidak perlu GitHub.","Upload the logo once and it appears on the Dashboard, sidebar, PIN screen, Parent Portal, Coach Portal, Coach Profile page, and browser tab icon. No GitHub needed.")}</p><div class="logo-prev-row"><div class="logo-prev-box" style="background:#0E1430;color:#fff"><img src="${shown}" style="width:56px;height:56px;border-radius:50%;background:#fff;padding:4px;object-fit:contain" alt=""><div><b>Dojang HQ</b><br><span style="font-size:12px;color:#9AA4D0">${T("Menu samping","Sidebar")}</span></div></div><div class="logo-prev-box" style="background:linear-gradient(105deg,#13247C 0 63%,#C8102E 63% 100%);color:#fff;border:0"><img src="${shown}" style="width:64px;height:64px;border-radius:50%;background:#fff;padding:5px;object-fit:contain;box-shadow:0 6px 18px rgba(0,0,0,.3)" alt=""><div><b>${T("Dashboard & Portal","Dashboard & Portals")}</b><br><span style="font-size:12px;opacity:.85">Hero</span></div></div><div class="logo-prev-box" style="background:#fff;color:#14182B"><img src="${shown}" style="width:46px;height:46px;border-radius:50%;object-fit:contain;border:1px solid #DCDFE8;padding:3px" alt=""><div><b>${T("Layar PIN","PIN screen")}</b><br><span style="font-size:12px;color:#5B6177">${T("Ikon tab","Tab icon")}</span></div></div></div><input id="logoFileData" type="file" accept="image/png,image/jpeg,image/webp"><p class="mu logo-hint">${T("Disarankan PNG berlatar transparan atau logo bulat. Otomatis diperkecil agar ringan.","PNG with transparent background or a round logo works best. It is resized automatically.")}</p><p style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-a="saveLogo">💾 ${T("Simpan Logo","Save Logo")}</button>${real?`<button class="btn ghost dn" data-a="delLogo">${T("Hapus Logo","Remove Logo")}</button>`:""}</p></div>`;
  }
  V.dat=()=>{const logoSec=logoSectionHtml();const coachRows=CList.map(c=>`<div class="row"><span><b>🥋 ${esc(c.name||c.id)}</b> ${c.dan?`<span class="pill dan">${esc(c.dan)}</span>`:""}</span><span style="display:flex;gap:8px"><button class="btn ghost dn" data-a="delCoach" data-id="${c.id}" data-coach="${esc(c.name||c.id)}">${cfCoach===c.id?T("Yakin hapus pelatih?","Confirm delete coach?"):T("Hapus Pelatih","Delete Coach")}</button>${cfCoach===c.id?`<button class="btn ghost" data-a="batalDelCoach">${T("Batal","Cancel")}</button>`:""}</span></div>`).join("");const stuRows=S.map(s=>`<div class="row"><span><span class="dot" style="background:${s.c}"></span><b>${s.n}</b> <span class="pill">${esc(s.unit)}</span> <span class="mu">${s.b}</span></span><span style="display:flex;gap:8px"><button class="btn ghost dn" data-a="del" data-id="${s.id}">${cf==s.id?T("Yakin hapus murid?","Confirm delete student?"):T("Hapus Murid","Delete Student")}</button>${cf==s.id?`<button class="btn ghost" data-a="cancel">${T("Batal","Cancel")}</button>`:""}</span></div>`).join("");return need()+`<div class="top"><div><h1>${T("Data & cadangan","Data & Backup")}</h1><span class="mu">${T("Simpan cadangan data ke file, pulihkan cadangan, atau kelola penghapusan data murid & pelatih.","Back up data to a file, restore backups, or manage student & coach record deletion.")}</span></div></div>${logoSec}<div class="sec"><h2>${T("Ekspor","Export")}</h2><p class="mu">${T("Unduh semua data murid, pelatih, absensi, iuran, penilaian, dan jadwal dalam satu file.","Download all students, coaches, attendance, tuition, evaluations, and schedules in one file.")}</p><button class="btn" data-a="exp">${T("Unduh cadangan (.json)","Download backup (.json)")}</button></div><div class="sec"><h2>${T("Impor","Import")}</h2><p class="mu">${T("Data dengan ID yang sama akan diganti. Data lain tetap ada.","Records with matching IDs will be replaced. Other records remain intact.")}</p><input type="file" id="impf" accept="application/json,.json"></div><div class="sec"><h2>🗑️ ${T("Hapus Data Pelatih","Delete Coach Records")} (${CList.length} ${T("terdaftar","registered")})</h2><p class="mu">${T("Hapus nama pelatih yang sudah tidak aktif dari daftar cepat dan Portal Pelatih.","Remove inactive coaches from quick-select and the Coach Portal.")}</p>${coachRows||`<p class="mu">${T("Belum ada data pelatih tambahan di database.","No additional coach records in database.")}</p>`}${CList.length?`<p style="margin-top:14px"><button class="btn ghost dn" data-a="resetCol" data-col="coaches">${cfReset==="coaches"?T("⚠️ KLIK LAGI: Hapus SEMUA Pelatih","⚠️ CLICK AGAIN: Delete ALL Coaches"):T("Hapus Semua Data Pelatih","Delete All Coach Records")}</button>${cfReset==="coaches"?` <button class="btn ghost" data-a="batalReset">${T("Batal","Cancel")}</button>`:""}</p>`:""}</div><div class="sec"><h2>🗑️ ${T("Hapus Data Murid","Delete Student Records")} (${S.length} total)</h2><p class="mu">${T("Hapus data murid satu per satu atau bersihkan seluruh data murid sekaligus.","Delete student records individually or clear all student records at once.")}</p>${stuRows||`<p class="mu">${T("Belum ada data murid.","No student data yet.")}</p>`}${S.length?`<p style="margin-top:14px"><button class="btn ghost dn" data-a="resetCol" data-col="students">${cfReset==="students"?T("⚠️ KLIK LAGI: Hapus SEMUA Murid","⚠️ CLICK AGAIN: Delete ALL Students"):T("Hapus Semua Data Murid","Delete All Student Records")}</button>${cfReset==="students"?` <button class="btn ghost" data-a="batalReset">${T("Batal","Cancel")}</button>`:""}</p>`:""}</div>`;};
  document.addEventListener("click",async e=>{const b=e.target.closest('[data-a="exp"]');if(!b)return;if(!db)return toast(T("Belum terhubung. Tunggu halaman siap.","Not connected yet. Please wait."));try{const out={exported:new Date().toISOString(),data:{}};for(const c of DCOL){const q=await db.collection(c).get();out.data[c]=q.docs.map(d=>({id:d.id,...d.data()}))}await dlFile("dojang-backup-"+ymd()+".json",JSON.stringify(out,null,2));localStorage.setItem("dojang_last_backup",new Date().toISOString());toast(T("Cadangan dibuat","Backup created"))}catch(x){toast(T("Gagal membuat cadangan","Failed to create backup"))}});
  document.addEventListener("change",e=>{const t=e.target;
    if(t.id==="scLogoInp"){
      const f=t.files&&t.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{
        const im=new Image();
        im.onload=()=>{
          const scale=Math.min(1,240/Math.max(im.width,im.height));
          const cv=document.createElement("canvas");
          cv.width=Math.max(1,Math.round(im.width*scale));
          cv.height=Math.max(1,Math.round(im.height*scale));
          cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
          pendingClubLogo=cv.toDataURL("image/png");
          draw();
        };
        im.src=rd.result;
      };
      rd.readAsDataURL(f);return;
    }
},true);
  document.addEventListener("change",async e=>{if(e.target.id!="impf")return;const f=e.target.files[0];if(!f)return;if(!db)return toast(T("Belum terhubung","Not connected"));try{const j=JSON.parse(await f.text());const dt=j.data||{};let n=0;for(const c of DCOL){for(const r of (dt[c]||[])){const {id,...rest}=r;await db.collection(c).doc(id).set(rest);n++}}toast(T("Impor selesai: ","Import complete: ")+n+T(" data"," records"));draw()}catch(x){toast(T("File tidak valid","Invalid file"))}e.target.value=""});
}
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js",{updateViaCache:"none"});</script><script>
(function(){
  var tx=function(a,b){try{return (typeof isEN==="function"&&isEN())?b:a}catch(e){return a}};
  var standalone=function(){return (window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||window.navigator.standalone===true};
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var KEY="pwa_dismiss",deferred=null,pill=null;
  var dismissed=function(){try{var t=+localStorage.getItem(KEY)||0;return Date.now()-t<7*864e5}catch(e){return false}};
  function hide(remember){if(pill){pill.remove();pill=null}if(remember){try{localStorage.setItem(KEY,String(Date.now()))}catch(e){}}}
  function guide(){
    if(document.getElementById("pwaDlg"))return;
    var d=document.createElement("div");d.id="pwaDlg";
    d.style.cssText="position:fixed;inset:0;z-index:9600;background:rgba(10,15,40,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px";
    d.innerHTML='<div class="sec" style="width:100%;max-width:420px;margin:0"><h2>📲 '+tx("Pasang di layar utama iPhone/iPad","Add to iPhone/iPad home screen")+'</h2><ol style="margin:8px 0 12px 18px;padding:0;line-height:1.7"><li>'+tx("Buka halaman ini di <b>Safari</b> (jika dari WhatsApp/Instagram, pilih ‘Buka di Safari’).","Open this page in <b>Safari</b> (if from WhatsApp/Instagram, choose ‘Open in Safari’).")+'</li><li>'+tx("Ketuk tombol <b>Bagikan</b> ⬆️ (kotak dengan panah ke atas).","Tap the <b>Share</b> button ⬆️ (square with an up arrow).")+'</li><li>'+tx("Pilih <b>Tambah ke Layar Utama</b>, lalu ketuk <b>Tambah</b>.","Choose <b>Add to Home Screen</b>, then tap <b>Add</b>.")+'</li></ol><button class="btn" id="pwaOk" style="width:100%;box-sizing:border-box">'+tx("Mengerti","Got it")+'</button></div>';
    document.body.appendChild(d);
    document.getElementById("pwaOk").onclick=function(){d.remove();hide(true)};
  }
  function show(){
    if(pill||standalone()||dismissed()||!document.body)return;
    pill=document.createElement("div");
    pill.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9100;display:flex;align-items:center;gap:4px;background:#1D3FA6;color:#fff;border-radius:999px;box-shadow:0 8px 24px rgba(14,20,48,.35);font:600 14px/1 Barlow,system-ui,sans-serif;max-width:calc(100% - 24px)";
    pill.innerHTML='<button id="pwaInstall" style="all:unset;cursor:pointer;padding:12px 8px 12px 18px;white-space:nowrap">📲 '+tx("Pasang aplikasi","Install app")+'</button><button id="pwaClose" aria-label="'+tx("Tutup","Close")+'" style="all:unset;cursor:pointer;padding:12px 16px 12px 8px;opacity:.8">✕</button>';
    document.body.appendChild(pill);
    document.getElementById("pwaClose").onclick=function(){hide(true)};
    document.getElementById("pwaInstall").onclick=async function(){
      if(deferred){deferred.prompt();try{await deferred.userChoice}catch(e){}deferred=null;hide(false)}
      else if(isIOS){guide()}
    };
  }
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;show()});
  window.addEventListener("appinstalled",function(){deferred=null;hide(false);try{localStorage.setItem(KEY,String(Date.now()+365*864e5))}catch(e){}});
  window.addEventListener("load",function(){if(isIOS&&!standalone())setTimeout(show,1500)});
  window.addEventListener("offline",function(){if(typeof toast==="function")toast(tx("Anda sedang offline","You are offline"))});
  window.addEventListener("online",function(){if(typeof toast==="function")toast(tx("Kembali online","Back online"))});
})();
</script><script>document.addEventListener("click",function(e){if(e.target.closest&&e.target.closest("[data-champ]"))location.href="/champion?pelatih=1"});</script></body></html>
