<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Dojang HQ – Platform Manajemen Dojang</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700;800&display=swap"><style>:root{--bg:#F4F5F8;--sf:#fff;--ink:#14182B;--mu:#5B6177;--ln:#DCDFE8;--bl:#1D3FA6;--rd:#C8102E;--ok:#1E7B4F;--tint:#E8EDFB;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1220;--sf:#181C30;--ink:#EEF0F8;--mu:#9AA1B8;--ln:#2A2F48;--bl:#8AA4FF;--rd:#FF7088;--ok:#5FD39A;--tint:#222849;color-scheme:dark}}:root[data-theme="dark"]{--bg:#0F1220;--sf:#181C30;--ink:#EEF0F8;--mu:#9AA1B8;--ln:#2A2F48;--bl:#8AA4FF;--rd:#FF7088;--ok:#5FD39A;--tint:#222849;color-scheme:dark}html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Barlow,system-ui,sans-serif;display:grid;grid-template-columns:242px 1fr;min-height:100vh}body.standalone-portal{grid-template-columns:1fr}body.standalone-portal nav{display:none}body.standalone-portal main{margin:0 auto;max-width:880px}h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}h1{font-size:34px;line-height:1.05}h2{font-size:22px}h3{font-size:18px}nav{background:#0E1430;border:0;padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}.brand{font:700 24px/1.1 "Barlow Condensed",Impact,sans-serif;padding:0 10px 24px;color:#fff;position:relative}.brand-wrap{display:flex;align-items:center;gap:11px}.brand-logo{width:46px;height:46px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 3px 10px rgba(0,0,0,.3);flex-shrink:0;display:block;object-fit:contain}.brand small{display:bl ius:50%;border:1px solid var(--ln);margin-right:5px}.bars{display:flex;align-items:flex-end;gap:10px;height:150px}.bars div{flex:1;background:linear-gradient(180deg,#4A6AE0,#1D3FA6);border-radius:8px;position:relative;min-height:4px}.bars div:last-child{background:linear-gradient(180deg,#F0506A,#C8102E)}.bars span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;color:var(--mu)}.xl{display:flex;gap:8px;font-size:12px;color:var(--mu)}.xl span{flex:1;text-align:center}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);align-items:center}.btn{all:unset;cursor:pointer;background:linear-gradient(135deg,#1D3FA6,#3860E0);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;display:inline-block;box-shadow:0 8px 18px -8px rgba(29,63,166,.7)}.btn.ghost{background:transparent;color:var(--bl);border:1px solid var(--bl);box-shadow:none}.btn.dn{color:var(--rd);border-color:var(--rd)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.chip{all:unset;cursor:pointer;padding:6px 14px;border:1px solid var(--ln);border-radius:999px;background:var(--sf);display:inline-flex;gap:8px;align-items:center}.chip[aria-pressed=true]{background:#13247C;color:#fff;border-color:#13247C;font-weight:600}.meter{height:12px;background:var(--ln);border-radius:6px;overflow:hidden;margin:6px 0 12px}.meter i{display:block;height:100%;background:linear-gradient(90deg,#2E9E5B,#5FD39A)}.sk{display:grid;grid-template-columns:118px 1fr 38px;gap:8px;align-items:center;margin:6px 0;font-size:14px}.sk .meter{margin:0}.sk .meter i{background:linear-gradient(90deg,#1D3FA6,#6C8BFF)}textarea,select,input:not([type=checkbox]):not([type=file]):not([type=range]){width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px}label{font-size:13px;color:var(--mu);display:block;margin-bottom:3px}label.row,label.tg{font-size:15px;color:var(--ink)}label.tg{display:flex;gap:8px;align-items:center;margin:6px 0}.pv{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:14px;white-space:pre-wrap;min-height:120px}.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--bl)}.pill.ok{background:rgba(30,123,79,.15);color:var(--ok);font-weight:600}.pill.warn{background:rgba(200,16,46,.15);color:var(--rd);font-weight:600}.pill.leave{background:rgba(242,182,0,.22);color:#9A6E00;font-weight:600}.pill.dan{background:#14182B;color:#F5C842;font-weight:700;border:1px solid rgba(245,200,66,.35)}.note{background:var(--tint);border-left:4px solid var(--bl);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px}#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999}#toast.on{opacity:1}.unit-sw{margin:4px 0 12px;padding:0 6px}.unit-sw label{color:#9AA4D0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}.unit-sw select{background:#1A2250;color:#fff;border:1px solid #3A4272;border-radius:8px;padding:7px 9px;font-size:13px;font-weight:600}.top-util{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:12px}.lang-pill{display:inline-flex;align-items:center;gap:2px;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:3px;box-shadow:0 2px 8px rgba(20,24,43,.08)}.lang-pill .gl{display:inline-flex;align-items:center;justify-content:center;color:var(--mu);padding:0 4px 0 7px}.lang-pill button{all:unset;cursor:pointer;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px;color:var(--mu);line-height:1.2}.lang-pill button[aria-pressed=true]{background:linear-gradient(135deg,#1D3FA6,#3860E0);color:#fff}.hero{display:grid;grid-template-columns:1.7fr 1fr;border-radius:20px;overflow:hidden;color:#fff;margin-bottom:24px;box-shadow:0 1px 2px rgba(20,24,43,.06),0 10px 28px -14px rgba(20,24,43,.25);background:linear-gradient(105deg,#13247C 0 63%,#C8102E 63% 100%)}.hl{padding:32px;display:flex;align-items:center;gap:18px}.hero-logo{width:76px;height:76px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 8px 22px rgba(0,0,0,.28);flex-shrink:0;display:block;object-fit:contain}.hl span{opacity:.85;font-size:14px}.hl h1{font-size:44px;margin:4px 0}.hl p{margin:0;opacity:.85}.hr{padding:32px 28px 32px 48px;display:flex;flex-direction:column;justify-content:center}.hr span{opacity:.9;font-size:14px}.hr b{font:700 34px/1.05 "Barlow Condensed",Impact,sans-serif;margin:4px 0}.hr small{opacity:.9;font-size:14px}.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.ev{display:flex;gap:10px;flex-wrap:wrap}.ev label{margin:0}.ev select{width:72px;padding:6px;border-radius:8px}#pinGate{position:fixed;inset:0;background:#0E1430;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9000}#pinGate .card{background:var(--sf);color:var(--ink);max-width:400px;width:100%;padding:28px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}.filter-box{background:var(--bg);padding:12px 14px;border-radius:12px;margin-bottom:14px}.filter-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}.filter-chips{display:flex;gap:6px;flex-wrap:wrap}.filter-chips .chip{padding:4px 10px;font-size:13px}.tbl-wrap{overflow-x:auto}table.att-tbl{width:100%;border-collapse:collapse;font-size:14px}table.att-tbl th,table.att-tbl td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}table.att-tbl th{font-size:12px;color:var(--mu);text-transform:uppercase}.star-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.star-btns{display:inline-flex;gap:6px}.star-btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--mu)}.star-btn.on{background:linear-gradient(135deg,#F2B600,#E09B00);color:#14182B;border-color:#D99600}@media (max-width:760px){body{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;padding:10px;align-items:center}.brand,.unit-sw{display:none}nav button{white-space:nowrap}main{padding:20px 16px}.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr;background:linear-gradient(172deg,#13247C 0 62%,#C8102E 62% 100%)}.hl{padding:24px 20px}.hl h1{font-size:32px}.hr{padding:20px 24px 28px}}</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0E1430"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"></head><body><div id="pinGate" style="display:none"><div class="card"><div style="display:flex;justify-content:flex-end;margin-bottom:6px"><div class="lang-pill" role="group"><span class="gl">🌐</span><button type="button" data-setlang="id" aria-pressed="true">ID</button><button type="button" data-setlang="en" aria-pressed="false">EN</button></div></div><h2 style="font-size:30px;text-align:center">Dojang HQ SaaS</h2><p id="pinSub" class="mu" style="margin:4px 0 18px;text-align:center">Masuk dengan Username & PIN Dojang</p><label>Username</label><input id="userInp" type="text" autocomplete="username" placeholder="Contoh: supreme / superadmin" style="margin-bottom:12px"><label>PIN Akses</label><input id="pinInp" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Masukkan PIN..." style="margin-bottom:12px;font-size:18px;letter-spacing:2px"><p id="pinErr" style="color:var(--rd);font-size:13px;margin:0 0 12px;display:none"></p><button id="pinBtn" class="btn" style="width:100%;text-align:center">Masuk ke Dojang HQ</button></div></div><nav aria-label="Menu utama"></nav><main id="app"></main><div id="toast" role="status"></div><script>
const NL=String.fromCharCode(10);
const BT3=String.fromCharCode(96).repeat(3);
const params=new URLSearchParams(location.search);
const portalId=(params.get("portal")||"").trim().replace(/^\/+|\/+$/g,"").trim();
const coachProfileId=(params.get("profil_pelatih")||params.get("coach_profile")||"").trim().replace(/^\/+|\/+$/g,"").trim();
const isCoachPortal=params.has("pelatih")||params.has("coach");
const clubParam=(params.get("club")||"").trim().toLowerCase();
let lang=localStorage.getItem("dojang_lang")||(params.get("lang")==="en"?"en":"id");
if(lang!=="id"&&lang!=="en")lang="id";
document.documentElement.lang=lang;
const isEN=()=>lang==="en";
const T=(a,b)=>isEN()?b:a;
const mk=(c,t,n)=>n==1?`linear-gradient(90deg,${c} 0 38%,${t} 38% 62%,${c} 62%)`:n==2?`linear-gradient(90deg,${c} 0 28%,${t} 28% 42%,${c} 42% 58%,${t} 58% 72%,${c} 72%)`:c;
const BL_ID=[["Putih",mk("#FFFFFF")],["Kuning",mk("#F2C200")],["Kuning strip",mk("#F2C200","#2E9E5B",1)],["Hijau",mk("#2E9E5B")],["Hijau strip",mk("#2E9E5B","#2457C5",1)],["Biru",mk("#2457C5")],["Biru strip",mk("#2457C5","#C8102E",1)],["Merah",mk("#C8102E")],["Merah strip 1",mk("#C8102E","#111111",1)],["Merah strip 2",mk("#C8102E","#111111",2)],["Hitam",mk("#111111")]];
const BL_EN=[["White",mk("#FFFFFF")],["Yellow",mk("#F2C200")],["Yellow stripe",mk("#F2C200","#2E9E5B",1)],["Green",mk("#2E9E5B")],["Green stripe",mk("#2E9E5B","#2457C5",1)],["Blue",mk("#2457C5")],["Blue stripe",mk("#2457C5","#C8102E",1)],["Red",mk("#C8102E")],["Red stripe 1",mk("#C8102E","#111111",1)],["Red stripe 2",mk("#C8102E","#111111",2)],["Black",mk("#111111")]];
const getBL=()=>isEN()?BL_EN:BL_ID;
const SK=["Poomsae","Kyorugi","Kekuatan","Kelenturan","Disiplin"],RP=500000;
const DAN_RANKS=["DAN 1 Kukkiwon","DAN 2 Kukkiwon","DAN 3 Kukkiwon","DAN 4 Kukkiwon","DAN 5 Kukkiwon","DAN 6 Kukkiwon","DAN 7 Kukkiwon","Sabuk Hitam (Poom)","Asisten Pelatih"];
const skLabel=k=>isEN()?({Poomsae:"Poomsae",Kyorugi:"Kyorugi",Kekuatan:"Strength",Kelenturan:"Flexibility",Disiplin:"Discipline",Mengajar:"Teaching",Teknik:"Technique",Komunikasi:"Communication",Ketepatan:"Punctuality"}[k]||k):k;
const genderLabel=g=>isEN()?({"Laki-laki":"Male","Perempuan":"Female"}[g]||g):g;
const getBeltCats=()=>[["all",T("Semua","All"),"#888"],["putih",T("Putih","White"),"#FFFFFF"],["kuning",T("Kuning","Yellow"),"#F2C200"],["hijau",T("Hijau","Green"),"#2E9E5B"],["biru",T("Biru","Blue"),"#2457C5"],["merah",T("Merah","Red"),"#C8102E"],["hitam",T("Hitam","Black"),"#111111"]];
const matchBeltCat=(bi,cat)=>{if(cat==="all")return true;if(cat==="putih")return bi===0;if(cat==="kuning")return bi===1||bi===2;if(cat==="hijau")return bi===3||bi===4;if(cat==="biru")return bi===5||bi===6;if(cat==="merah")return bi===7||bi===8||bi===9;if(cat==="hitam")return bi===10;return true;};
const esc=s=>String(s??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hm=()=>new Date().toTimeString().slice(0,5);
const addDays=(dStr,days)=>{const d=new Date(dStr+"T00:00:00");d.setDate(d.getDate()+days);return d.toISOString().slice(0,10);};
const rp=n=>"Rp"+(Number(n)||0).toLocaleString("id-ID");
const wan=x=>{x=String(x||"").replace(/[^0-9]/g,"");return x.startsWith("0")?"62"+x.slice(1):x};
const slug=s=>String(s||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"item";
const $=s=>document.querySelector(s);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2600)}
function radar(sk){const k=Object.keys(sk),c=110,r=78;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/k.length;return[(c+Math.cos(a)*r*v/100).toFixed(1),(c+Math.sin(a)*r*v/100).toFixed(1)]};const poly=v=>k.map((_,i)=>pt(i,v).join(",")).join(" ");const own=k.map((x,i)=>pt(i,sk[x]).join(",")).join(" ");const lb=k.map((x,i)=>{const[p,q]=pt(i,122);return`<text x="${p}" y="${q}" text-anchor="middle" font-size="12" fill="var(--mu)">${skLabel(x)}</text>`}).join("");return`<svg viewBox="0 0 220 220" width="100%" style="max-width:300px"><polygon points="${poly(100)}" fill="none" stroke="var(--ln)"/><polygon points="${poly(50)}" fill="none" stroke="var(--ln)"/><polygon points="${own}" fill="var(--bl)" fill-opacity=".25" stroke="var(--bl)" stroke-width="2"/>${lb}</svg>`}
function langBarHtml(inline){const pill=`<div class="lang-pill" role="group"><span class="gl">🌐</span><button type="button" data-setlang="id" aria-pressed="${!isEN()}">ID</button><button type="button" data-setlang="en" aria-pressed="${isEN()}">EN</button></div>`;return inline?pill:`<div class="top-util">${pill}</div>`;}
const isParentCoachEvalDoc=x=>Boolean(x&&(x.type==="coach_eval"||String(x.id||"").startsWith("coach_eval__")));

if(portalId){
  document.body.classList.add("standalone-portal");
  const ymNow=ymd().slice(0,7);
  let portalData=null;
  function renderParentPortal(){
    if(!portalData)return;
    const data=portalData,BL=getBL();
    const club=data.club||{name:"Dojang HQ",headCoach:"Kepala Pelatih",logo:""};
    const d=data.student||data;
    const sUnit=d.unit||"Utama";
    const sFee=(d.fee!==undefined&&d.fee!==null&&d.fee!==""&&Number(d.fee)>=0)?Number(d.fee):RP;
    const bi=Math.max(0,Math.min(10,Number(d.v==2?(d.bi||0):([0,1,3,5,7,10][d.bi||0]??0))||0));
    const beltName=BL[bi][0],beltColor=BL[bi][1];
    const nextBelt=bi<10?BL[bi+1][0].toLowerCase():"dan";
    const sk={...(d.sk||{})};SK.forEach(k=>sk[k]=sk[k]??50);
    const since=d.sejak||"0000-00-00";
    const sesSince=(data.attendance||[]).filter(x=>x.id>=since);
    const attRate=sesSince.length?sesSince.filter(x=>x.hadir).length/sesSince.length:0;
    const evSince=(data.evaluations||[]).filter(x=>(x.date||x.id)>=since);
    const r=[];evSince.forEach(x=>["t","k","f"].forEach(k=>{if(Number.isFinite(x[k]))r.push(x[k])}));
    const scRate=r.length?r.reduce((p,c)=>p+c,0)/r.length/5:0;
    const pct=(sesSince.length||r.length)?Math.round((scRate*0.7+attRate*0.3)*100):(Number(d.pct)||0);
    const attTotal=(data.attendance||[]).length?Math.round(data.attendance.filter(x=>x.hadir).length/data.attendance.length*100):0;
    const payCur=(data.payments||[]).find(x=>x.id===ymNow);
    const isLunas=!!(payCur&&payCur.lunas);
    const recentAtt=[...(data.attendance||[])].sort((a,b)=>a.id<b.id?1:-1).slice(0,8);
    const recentEv=[...(data.evaluations||[])].sort((a,b)=>(a.date||a.id)<(b.date||b.id)?1:-1);
    const av=k=>{const v=recentEv.map(x=>x[k]).filter(Number.isFinite);return v.length?(v.reduce((p,c)=>p+c,0)/v.length).toFixed(1):"–"};
    const nc=(data.classes||[]).find(c=>(c.unit||"Utama")===sUnit)||(data.classes||[])[0];
    const hc=club.headCoach||"Kepala Pelatih";
    const waKonfirm=isEN()?`Hello ${hc}, I am the parent/guardian of ${d.n} (Unit ${sUnit}) confirming monthly tuition for ${ymNow} (${rp(sFee)}) at ${club.name}.`:`Halo ${hc}, saya orang tua/wali dari ${d.n} (Unit ${sUnit}) ingin konfirmasi iuran bulan ${ymNow} (${rp(sFee)}) di ${club.name}.`;

    },
    upd(){
      return `${langBarHtml()}<div class="top"><div><h1>🚀 ${T("Update Aplikasi SaaS (Terpusat)","Centralized SaaS App Update")}</h1><span class="mu">${T("Sekali update ke main, seluruh dojang klien otomatis mendapat versi terbaru.","Once updated to main, all client dojangs automatically receive the latest version.")}</span></div></div><div class="sec"><div class="f" style="margin-bottom:10px"><div><label>GitHub Personal Access Token</label><input id="ghTok" type="password" placeholder="github_pat_..." value="${esc(localStorage.getItem("dojang_gh_tok")||"")}"></div><div><label>${T("Judul Commit (opsional)","Commit Title (optional)")}</label><input id="ghTitle" type="text"></div></div><label>${T("Tempel Kode HTML Update","Paste Update HTML Code")}</label><textarea id="ghPkg" rows="8" placeholder="<!DOCTYPE html>..."></textarea><div id="ghRes" style="margin-top:10px"></div><p style="margin-top:12px"><button class="btn" data-a="ghRun" data-mode="direct">🚀 ${T("Update Langsung ke Main (Semua Klien)","Update Directly to Main (All Clients)")}</button></p></div>`;
    }
  };

  function buildNav(){
    const navEl=document.querySelector("nav");
    if(__role==="superadmin"&&!__club){
      navEl.innerHTML=`<div class="brand"><div>Dojang HQ<small>👑 Super Admin SaaS</small></div></div><button data-v="sa">🏢 ${T("Kelola Dojang Klien","Client Dojangs")}</button><button data-v="upd">🚀 ${T("Update App (Semua Klien)","Update App (All Clients)")}</button><button id="logoutBtn" style="margin-top:auto;opacity:.8">🔒 ${T("Keluar","Sign Out")}</button>`;
    }else{
      const lu=clubLogo();
      const NV=[["dash","🥋 "+T("Dashboard","Dashboard")],["mur","👥 "+T("Murid","Students")],["abs","✅ "+T("Absensi","Attendance")],["pen","📝 "+T("Penilaian","Evaluations")],["iur","💳 "+T("Iuran","Tuition")],["uji","🥇 "+T("Ujian sabuk","Belt Test")],["lap","📊 "+T("Laporan murid","Student Report")],["jad","📅 "+T("Jadwal & Unit","Schedule & Units")],["dat","💾 "+T("Data","Data & Backup")]];
      if(__role==="superadmin")NV.push(["upd","🚀 "+T("Update App","Update App")]);
      navEl.innerHTML=`<div class="brand"><div class="brand-wrap">${lu?`<img class="brand-logo" src="${lu}" alt="${esc(clubName())}">`:""}<div>Dojang HQ<small>${esc(clubName())}</small></div></div></div>`+`<div class="unit-sw"><label>${T("Pilih Unit","Select Unit")}</label><select id="unitSel"></select></div>`+NV.map(x=>`<button data-v="${x[0]}">${x[1]}</button>`).join("")+`<button id="logoutBtn" style="margin-top:auto;opacity:.8">🔒 ${T("Keluar","Sign Out")}</button>`;
      const uSel=document.getElementById("unitSel");
      if(uSel)uSel.onchange=e=>{curUnit=e.target.value;draw();};
    }
    const lo=document.getElementById("logoutBtn");
    if(lo)lo.onclick=()=>{localStorage.removeItem("dojang_pin");localStorage.removeItem("dojang_target_club");__pin="";__targetClub="";__role="";__club=null;showPin("");};
  }

  function draw(){
    if(__role==="superadmin"&&!__club){
      if(cur!=="sa"&&cur!=="upd")cur="sa";
      $("#app").innerHTML=V[cur]();
      document.querySelectorAll("nav button[data-v]").forEach(b=>b.setAttribute("aria-current",b.dataset.v===cur));
      return;
    }
    sync(__rawStudents);
    S.forEach(s=>{s.att=A.length?Math.round(A.filter(x=>x.ids&&x.ids[s.id]).length/A.length*100):0;s.pct=prog(s)});
    const uSel=document.getElementById("unitSel");
    if(uSel){
      const units=getUnits();
      if(curUnit!=="all"&&!units.includes(curUnit))curUnit="all";
      uSel.innerHTML=`<option value="all" ${curUnit==="all"?"selected":""}>🌐 ${T("Semua Unit","All Units")} (${units.length})</option>`+units.map(u=>`<option value="${esc(u)}" ${curUnit===u?"selected":""}>🥋 ${esc(u)}</option>`).join("");
    }
    if(!V[cur])cur="dash";
    $("#app").innerHTML=V[cur]();
    document.querySelectorAll("nav button[data-v]").forEach(b=>b.setAttribute("aria-current",b.dataset.v===cur));
  }

  document.addEventListener("click",async e=>{
    const lb=e.target.closest("[data-setlang]");if(lb){lang=lb.dataset.setlang;localStorage.setItem("dojang_lang",lang);buildNav();draw();return;}
    const nv=e.target.closest("[data-v],[data-lid]");
    if(nv){if(nv.dataset.v)cur=nv.dataset.v;if(nv.dataset.lid){selId=nv.dataset.lid;cur="lap";}return draw();}
    const b=e.target.closest("[data-a]");if(!b)return;
    const a=b.dataset.a,id=b.dataset.id;

    if(a==="newClub"){edClub={isEdit:false};pendingClubLogo="";cfDelClub=null;return draw();}
    if(a==="editClub"){const found=__saClubs.find(c=>c.id===id);if(found){edClub={...found,isEdit:true};pendingClubLogo=found.logo||"";}return draw();}
    if(a==="cancelClub"){edClub=null;pendingClubLogo="";return draw();}
    if(a==="clearClubLogo"){pendingClubLogo="";if(edClub)edClub.logo="";return draw();}
    if(a==="saveClub"){
      const nm=(document.getElementById("sc_name")?.value||"").trim();
      const rawId=(document.getElementById("sc_id")?.value||"").trim()||slug(nm);
      const cid=slug(rawId);
      const uName=(document.getElementById("sc_user")?.value||"").trim().toLowerCase()||cid;
      const uPin=(document.getElementById("sc_pin")?.value||"").trim();
      if(!nm||!cid||!uPin)return toast(T("Nama dojang, Slug ID, dan PIN wajib diisi","Dojang name, Slug ID, and PIN are required"));
      const payload={
        name:nm,
        adminUser:uName,
        adminPin:uPin,
        headCoach:(document.getElementById("sc_hc")?.value||"").trim()||"Kepala Pelatih",
        ownerWa:(document.getElementById("sc_wa")?.value||"").trim(),
        plan:(document.getElementById("sc_plan")?.value||"Basic"),
        expiresAt:(document.getElementById("sc_exp")?.value||"").trim(),
        status:(document.getElementById("sc_status")?.value||"active"),
        logo:pendingClubLogo||(edClub&&edClub.logo)||"",
        updatedAt:new Date().toISOString()
      };
      await db.collection("clubs").doc(cid).set(payload);
      edClub=null;pendingClubLogo="";
      toast(T("✓ Dojang klien tersimpan!","✓ Client dojang saved!"));
      return;
    }
    if(a==="extendClub"){
      const found=__saClubs.find(c=>c.id===id);if(!found)return;
      const days=+b.dataset.days||30;
      const base=(found.expiresAt&&found.expiresAt>ymd())?found.expiresAt:ymd();
      await db.collection("clubs").doc(id).patch({expiresAt:addDays(base,days),status:"active"});
      toast(T("✓ Masa aktif diperpanjang +","✓ Extended +")+days+T(" hari"," days"));
      return;
    }
    if(a==="delClub"){
      if(cfDelClub!==id){cfDelClub=id;return draw();}
      await db.collection("clubs").doc(id).delete();
      cfDelClub=null;
      toast(T("Dojang klien dihapus","Client dojang deleted"));
      return;
    }
    if(a==="enterClub"){
      __targetClub=id;
      localStorage.setItem("dojang_target_club",id);
      cur="dash";
      await __pull();
      return;
    }
    if(a==="backToSa"){
      __targetClub="";
      localStorage.removeItem("dojang_target_club");
      cur="sa";
      await __pull();
      return;
    }

    if(a==="ghRun"){
      const tok=document.getElementById("ghTok").value.trim();
      const raw=document.getElementById("ghPkg").value.trim();
      const title=(document.getElementById("ghTitle")?.value||"").trim()||("Update Dojang HQ SaaS ("+ymd()+")");
      const resBox=document.getElementById("ghRes");
      if(!tok||!raw)return toast(T("Isi Token GitHub & kode HTML update dulu","Enter GitHub Token & update HTML code first"));
      localStorage.setItem("dojang_gh_tok",tok);
      const clean=raw.replace(new RegExp("^"+BT3+"[a-zA-Z0-9_-]*\\s*\\n?","i"),"").replace(new RegExp("\\n?\\s*"+BT3+"$"),"").trim();
      resBox.innerHTML=`<span class="pill">${T("Mengirim update ke GitHub main...","Pushing update to GitHub main...")}</span>`;
      try{
        const r=await fetch("/api/deploy",{method:"POST",headers:__hdr({"content-type":"application/json"}),body:JSON.stringify({token:tok,mode:"direct",title,files:[{path:"index.html",content:clean}]})});
        const d=await r.json();
        if(!r.ok)throw new Error(d.error||"Failed");
        resBox.innerHTML=`<div class="note">✓ ${T("Berhasil di-update ke main! Seluruh dojang klien akan mendapat update ini dalam ~30 detik.","Updated directly to main! All client dojangs will receive this update within ~30 seconds.")}</div>`;
        toast(T("✓ Update berhasil dikirim!","✓ Update deployed!"));
      }catch(err){resBox.innerHTML=`<span class="pill warn">Error: ${esc(err.message)}</span>`;}
      return;
    }

    const C=n=>db.collection(n),v=i=>(document.getElementById(i)?.value||"").trim();
    if(a==="add"){ed={};cf=null;return draw();}
    if(a==="edit"){ed=S.find(s=>s.id===id);return draw();}
    if(a==="cancel"){ed=null;return draw();}
    if(a==="copyPortal"){const url=location.origin+"/?portal="+encodeURIComponent(id);await navigator.clipboard.writeText(url).catch(()=>{});return toast(T("Link Portal Orang Tua disalin!","Parent Portal link copied!"));}
    if(a==="copyCoachPortal"){const url=location.origin+"/?pelatih=1&club="+encodeURIComponent((__club&&__club.id)||"");await navigator.clipboard.writeText(url).catch(()=>{});return toast(T("Link Portal Pelatih disalin!","Coach Portal link copied!"));}
    if(a==="save"){
      const uName=ensureUnit(v("fu")||"Utama");
      const rawFee=v("ffee");
      const o={n:v("fn"),gender:v("fgender"),ortu:v("fortu"),unit:uName,fee:(rawFee!==""&&Number(rawFee)>=0)?Number(rawFee):null,a:+v("fa")||0,v:2,bi:+v("fb"),wa:v("fw"),note:v("fo"),cuti:!!document.getElementById("fc")?.checked,sk:(ed&&ed.sk)||{}};
      if(!o.n)return toast(T("Isi nama murid","Enter student name"));
      if(ed.id)await C("students").doc(ed.id).update(o);else await C("students").add(o);
      ed=null;toast(T("Tersimpan","Saved"));return;
    }
    if(a==="del"){if(cf!==id){cf=id;return draw();}await C("students").doc(id).delete();cf=null;toast(T("Dihapus","Deleted"));return;}
    if(a==="lulus"){if(cfLulus!==id){cfLulus=id;return draw();}const s=S.find(x=>x.id===id);await C("students").doc(id).update({v:2,bi:s.bi+1,pct:0,sejak:ymd(),siap:false});cfLulus=null;toast(T("Naik sabuk!","Promoted!"));return;}
    if(a==="addUnit"){const u=v("newUnitInp");if(!u)return;ensureUnit(u,+v("newUnitFee")||RP);toast(T("Unit ditambahkan","Unit added"));return;}
    if(a==="cls"){if(!v("jh"))return;await C("classes").add({unit:ensureUnit(v("ju")||"Utama"),h:v("jh"),j:v("jj"),l:v("jl"),p:v("jp")});toast(T("Jadwal tersimpan","Schedule saved"));return;}
    if(a==="dc"){await C("classes").doc(id).delete();toast(T("Jadwal dihapus","Schedule deleted"));return;}
    if(a==="evsave"){
      const cName=(document.getElementById("coachInp")?.value||headCoachName()).trim();
      const docId=ad+"__"+slug(cName);
      const ev={};
      activeS().forEach(s=>{
        const r={};document.querySelectorAll('[data-ev="'+s.id+'"]').forEach(i=>{if(i.value)r[i.dataset.k]=+i.value});
        const n=((document.querySelector('[data-en="'+s.id+'"]')||{}).value||"").trim();
        if(Object.keys(r).length||n)ev[s.id]={...r,n};
      });
      await C("evaluations").doc(docId).set({date:ad,coach:cName,updatedAt:ymd()+" "+hm(),ev});
      toast(T("Penilaian tersimpan!","Evaluation saved!"));return;
    }
    if(a==="exp"){
      const DCOL=["students","attendance","payments","leads","classes","evaluations","coaches","units"];
      const out={exported:new Date().toISOString(),clubId:(__club&&__club.id)||"",data:{}};
      for(const c of DCOL)out.data[c]=(__cache[c]||[]).map(({clubId,...rest})=>rest);
      const el=document.createElement("a");
      el.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));
      el.download="backup-"+slug(clubName())+"-"+ymd()+".json";
      document.body.appendChild(el);el.click();el.remove();
      toast(T("Cadangan diunduh","Backup downloaded"));
    }
  });

  document.addEventListener("change",async e=>{
    const t=e.target;
    if(t.id==="scLogoInp"){
      const f=t.files&&t.files[0];if(!f)return;
      const rd=new FileReader();
      rd.onload=()=>{
        const im=new Image();
        im.onload=()=>{
          const scale=Math.min(1,240/Math.max(im.width,im.height));
          const cv=document.createElement("canvas");
          cv.width=Math.max(1,Math.round(im.width*scale));
          cv.height=Math.max(1,Math.round(im.height*scale));
          cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
          pendingClubLogo=cv.toDataURL("image/png");
          draw();
        };
        im.src=rd.result;
      };
      rd.readAsDataURL(f);return;
    }
    if(t.id==="impf"){
      const f=t.files[0];if(!f)return;
      try{
        const j=JSON.parse(await f.text());const dt=j.data||{};let n=0;
        for(const c of ["students","attendance","payments","leads","classes","evaluations","coaches","units"]){
          for(const r of (dt[c]||[])){const{id,clubId,...rest}=r;await db.collection(c).doc(id).set(rest);n++;}
        }
        toast(T("Impor selesai: ","Imported: ")+n+T(" data"," records"));
      }catch(err){toast(T("File JSON tidak valid","Invalid JSON file"));}
      t.value="";return;
    }
    if(t.id==="ad"){ad=t.value||ad;return draw();}
    if(t.id==="ym"){ym=t.value||ym;return draw();}
    if(t.id==="lapSelMurid"){selId=t.value;return draw();}
    const att=!!t.dataset.ab,id=t.dataset.ab||t.dataset.py;
    if(!id||!db)return;
    const key=att?ad:ym,r=(att?A:P).find(x=>x.id==key),ids={...((r&&r.ids)||{}),[id]:t.checked};
    await db.doc((att?"attendance/":"payments/")+key).set(att?{date:key,ids}:{ids});
  });

  (async()=>{
    const c=await claude.use("db");db=c;
    const sub=(n,f)=>db.collection(n).onSnapshot(q=>{f(q.docs.map(d=>({id:d.id,...d.data()})));if(!document.activeElement?.closest?.("#app input,#app textarea,#app select"))draw();});
    sub("students",sync);sub("attendance",x=>A=x);sub("payments",x=>P=x);sub("leads",x=>Lz=x);sub("evaluations",x=>E=x);sub("classes",x=>J=x);sub("coaches",x=>CList=x);sub("units",x=>UList=x);
  })();
}
</script></body></html>
